name: Wiki
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Commit or ref before the changes under review
        required: true
        type: string
permissions:
  contents: read
jobs:
  wiki-sync:
    name: wiki-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generated snapshot and Wiki lint
        run: |
          node wiki-project/scripts/build-code-index.mjs . --check
          node wiki-project/scripts/lint-wiki.mjs .
      - name: Wiki regression tests
        run: node --test wiki-project/scripts/wiki-tools.test.mjs wiki-project/scripts/wiki-sync.test.mjs
      - name: Require code and Wiki in the same delivery
        env:
          WIKI_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: node wiki-project/scripts/check-wiki-sync.mjs . --base "$WIKI_BASE_SHA"
