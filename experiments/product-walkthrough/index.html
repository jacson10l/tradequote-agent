order-top:1px solid var(--border);margin-top:8px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:-3px 0 16px;overflow:auto}.tabs button{border:0;border-radius:0;white-space:nowrap;background:transparent;padding:10px 12px;font-size:13px}.tabs button.active{color:var(--action);border-bottom:2px solid var(--action);font-weight:600}.note{background:#fafafa;border:1px solid var(--border);padding:12px;border-radius:8px;font-size:12px;color:#555}.note.warning{background:#fff8e8;border-color:#e8d19b;color:#734004}.note.error{background:#fff1ef;border-color:#edb3ac;color:var(--red)}.note.success{background:#eff8f0;border-color:#b8d4bd;color:var(--green)}.text-block{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.quote-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.quote-fields>div{padding:10px 12px;background:#fafafa;border-radius:6px}.quote-fields small{display:block;margin-bottom:4px}.empty{padding:38px 20px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--muted)}.chat{display:grid;gap:12px;max-height:340px;overflow:auto;padding-right:3px;margin-bottom:12px}.bubble{background:var(--warm);border:1px solid #ebdfbe;padding:11px 12px;border-radius:10px;font-size:12px}.bubble.user{background:#f6f6f6;border-color:#e6e6e6;margin-left:25px}.bubble small{display:block;font-size:10px;margin-bottom:5px}.suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.suggestions button{font-size:11px;min-height:28px;padding:4px 7px}.issue{border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:8px;padding:12px;margin-bottom:10px}.issue.block{border-left-color:var(--red)}.issue .issue-title{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:6px}.issue p{font-size:12px;color:#555}.issue .row{margin-top:8px}.timeline{border-left:1px solid #ddd;padding-left:16px;margin-left:7px}.event{position:relative;padding:0 0 20px}.event:before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;background:#fff;border:2px solid var(--brand);border-radius:50%}.event small{display:block}.owner{font-family:ui-monospace,monospace;font-size:11px;color:#555}.code{background:#f5f5f5;border:1px solid #e5e5e5;padding:9px;border-radius:6px;font:11px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.output-paper{padding:28px;border:1px solid var(--border);background:#fff;min-height:300px;white-space:pre-wrap;line-height:1.85;font-size:13px}.output-paper h2{font-size:22px}.checkline{display:flex;align-items:start;gap:9px}.checkline input{margin-top:5px}.dialog{border:1px solid #ddd;border-radius:14px;width:min(690px,calc(100vw - 32px));padding:0;max-height:88dvh;box-shadow:0 20px 70px #0002;color:var(--text)}.dialog::backdrop{background:#1b1b1b55}.dialog-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}.dialog-body{padding:20px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:#fafafa}.dialog-error{margin:0 20px 14px;color:var(--red);font-size:12px}.dialog input[type=checkbox]{width:auto}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 6px 25px #0002;max-width:80vw;z-index:20;font-size:13px}.toast.error{border-color:#edb3ac;color:var(--red)}.dev-panel{background:#fff8e0}.progress{height:3px;background:#eee;overflow:hidden;margin:12px 0}.progress i{display:block;background:var(--brand);height:100%;width:40%;animation:slide 1.2s ease-in-out infinite}.version-select{width:auto;max-width:160px}.highlight{box-shadow:0 0 0 2px var(--brand);background:#fff8e0!important}.file-label{display:inline-block;border:1px solid #ccc;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12px}.file-label input{position:absolute;opacity:0;width:1px;height:1px}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.section-kicker{font-size:11px;color:var(--muted);letter-spacing:.4px;margin-bottom:6px}.document-title{font-size:24px;letter-spacing:-.7px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}.field-inline{width:75px}.no-margin{margin:0}.source-card{border:1px solid var(--border);border-radius:8px;padding:12px}.spacer{height:14px}.inline-error{font-size:12px;color:var(--red);min-height:20px}.page-help{font-size:12px;color:var(--muted);margin-top:12px}.app-footer{font-size:11px;color:var(--muted);text-align:center;padding:12px 0 2px}

<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">T↗</div><div><strong>TradeQuote</strong><small>询报价协同工作台</small></div></div><div class="workspace"><strong>北辰出口 · 演示工作区</strong><span>合成企业 · 本地模拟</span></div><nav class="nav" id="nav" aria-label="主导航"></nav><div class="sidebar-bottom"><button data-action="guide">开发说明 ↗</button><button data-action="reset">重置演示</button><small><span class="status-dot"></span>离线运行 · 不调用真实模型<br>所有资料和商业条件均为假数据</small></div></aside><main id="main" class="main" tabindex="-1"></main></div>
<dialog id="dialog" class="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
// Standalone educational prototype. No network, production data, credentials or Electron APIs.
const STORAGE_KEY='tradequote-product-walkthrough-v1';
const $=s=>document.querySelector(s);
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=prefix=>prefix+'-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9));
const now=()=>new Date().toLocaleString('zh-CN',{hour12:false});
const frozenDate='2026-10-21';
const badge=(text,tone='')=>`<span class="badge ${tone}">${esc(text)}</span>`;
const btn=(text,action,extra='',style='')=>`<button type="button" class="${style}" data-action="${action}" ${extra}>${text}</button>`;
const field=(label,name,value='',type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
const select=(label,name,options,value)=>`<label>${label}<select name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
const textfield=(label,name,value='',extra='')=>`<label>${label}<textarea name="${name}" ${extra}>${esc(value)}</textarea></label>`;
const panel=(title,body,actions='',sub='')=>`<section class="panel"><div class="panel-head"><div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div><div class="row">${actions}</div></div>${body}</section>`;
const SAMPLE_CSV='sku,name,category,unit,currency,min_quantity,unit_price,valid_until,description\nDEMO-TEE,定制圆领上衣,服装,piece,USD,1,10,2027-12-31,合成棉质基础款\nDEMO-TEE,定制圆领上衣,服装,piece,USD,100,9,2027-12-31,合成棉质基础款\nDEMO-PANEL,复合装饰板,板材,m2,USD,1,18,2027-12-31,合成板材样本\nDEMO-BOLT,标准紧固件,五金,kg,USD,1,,2027-12-31,缺少售价的合成样本';
const PRODUCTS=[{id:'p-tee',sku:'DEMO-TEE',name:'定制圆领上衣',category:'服装',unit:'piece',currency:'USD',tiers:[{min:'1',price:'10'},{min:'100',price:'9'}],cost:'6',valid:'2027-12-31',source:'合成商品价目表.csv',line:2},{id:'p-panel',sku:'DEMO-PANEL',name:'复合装饰板',category:'板材',unit:'m2',currency:'USD',tiers:[{min:'1',price:'18'}],cost:'11',valid:'2027-12-31',source:'合成商品价目表.csv',line:4},{id:'p-bolt',sku:'DEMO-BOLT',name:'标准紧固件',category:'五金',unit:'kg',currency:'USD',tiers:[{min:'1',price:null}],cost:null,valid:'2027-12-31',source:'合成商品价目表.csv',line:5}];
const knowledgeSeed=()=>[
 {id:'k-contract',entry:'contract',version:1,title:'付款与交期确认规范',kind:'合同条款',status:'published',valid:'2027-12-31',scope:'通用',source:'合成企业报价SOP.txt',original:'对外报价必须明确付款方式与交货条件。未经采购确认，不得承诺保证交期。',body:'报价需包含付款和交期；交期文字含“保证”时必须退回核实。',reviewer:'演示资料管理员',created:now()},
 {id:'k-market',entry:'market',version:1,title:'目标市场资料核对清单',kind:'目标市场',status:'published',valid:'2027-12-31',scope:'德国',source:'合成市场核对清单.txt',original:'本演示要求报价明确包装描述。此要求仅用于交互测试，不构成任何国家或平台的真实法规。',body:'请填写包装方式并标明依据。不得把模拟检查结果表述为真实合规结论。',reviewer:'演示资料管理员',created:now()},
 {id:'k-terms',entry:'glossary',version:1,title:'英语与德语商务术语',kind:'术语',status:'published',valid:'2027-12-31',scope:'通用',source:'合成术语表.txt',original:'报价：Quotation / Angebot。交期：Delivery time / Lieferzeit。所有数值从报价快照引用。',body:'英语和德语输出必须保持SKU、数量、金额与条款事实一致。',reviewer:'演示资料管理员',created:now()}
];
function initial(empty=false){return {schema:1,workspace:'北辰出口 · 演示工作区',scenario:{platform:'阿里国际站 RFQ',market:'德国',category:'跨品类出口',languages:'英语 / 德语'},products:empty?[]:clone(PRODUCTS),batches:[],knowledge:empty?[]:knowledgeSeed(),quotes:[],runs:[],events:[],settings:{model:'DeepSeek（离线替身）',failure:'none',delay:'1800'},sequence:0};}
let state=initial(),storedCandidate=null,hasStoredState=false;let page='overview',tab='detail',selected=null,viewVersion=null,devOpen=false,toastTimer,dialogHandler=null,lastFocus=null;
const timers=new Map();let storageAvailable=true;
try{const saved=localStorage.getItem(STORAGE_KEY);if(saved){const candidate=JSON.parse(saved);if(candidate.schema===1&&Array.isArray(candidate.quotes)&&Array.isArray(candidate.products)&&Array.isArray(candidate.knowledge)&&Array.isArray(candidate.events)&&Array.isArray(candidate.runs)&&candidate.settings&&candidate.scenario&&Array.isArray(candidate.batches))storedCandidate=candidate;}}catch{storageAvailable=false;}

function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{storageAvailable=false;}}
function event(text){state.events.unshift({id:id('event'),at:now(),text});state.events=state.events.slice(0,100);persist();}
function toast(text,error=false){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').className='toast'+(error?' error':'');$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,error?6500:3500);}
function go(next){page=next;viewVersion=null;render();$('#main').scrollTop=0;}
function current(){return state.quotes.find(q=>q.id===selected)||state.quotes[0]||null;}
function latest(q=current()){return q?.revisions.at(-1)||null;}
function viewed(q=current()){return q?.revisions.find(r=>r.id===viewVersion)||latest(q);}
function exact(text,allowZero=true){if(!/^(0|[1-9]\d{0,6})(\.\d{1,4})?$/.test(String(text)))throw Error('请输入普通十进制数字，最多7位整数和4位小数。');const [a,b='']=String(text).split('.');const value=BigInt(a)*10000n+BigInt(b.padEnd(4,'0'));if(!allowZero&&value===0n)throw Error('数量必须大于0。');return value;}
const divRound=(a,b)=>(a+b/2n)/b;
const decimal4=v=>`${v/10000n}.${String(v%10000n).padStart(4,'0')}`;
const unitMoney=(v,currency='USD')=>v===null?'待确认':currency+' '+v.replace(/(\.\d{2})0+$/,'$1');
const money=(c,currency='USD')=>c===null?'待确认':`${currency} ${(BigInt(c)/100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}.${String(BigInt(c)%100n).padStart(2,'0')}`;
// Packaging is a separate confirmed fact, never a string-presence shortcut.
function packagingBasis(r){return JSON.stringify({scenario:r.scenario,lines:r.lines.map(l=>[l.product,l.quantity]),packaging:r.packaging,currency:r.currency,fx:r.fx,mode:r.mode,margin:r.margin,discount:r.discount});}
function packagingInfo(r){return r.packagingMeta||{status:r.packaging?'requested':'unknown',cost:{mode:'unknown'},evidence:'旧记录或手工文本：尚无结构化采购确认'};}
function packagingReady(r){const p=packagingInfo(r);return ['confirmed','not_applicable'].includes(p.status)&&p.basis===packagingBasis(r)&&!!p.confirmedBy&&!!p.evidence&&!!r.packaging.trim();}
function packagingCost(r){const p=packagingInfo(r);if(!packagingReady(r))return null;if(p.cost?.mode==='additional')return divRound(exact(p.cost.amount),100n).toString();if(['included','none'].includes(p.cost?.mode)&&p.cost.reference?.trim())return '0';return null;}
function packagingCostLabel(r){const c=packagingInfo(r).cost;return ({unknown:"待确认",additional:"另计包装费",included:"已含指定项目",none:"明确零费用"})[c?.mode]+(c?.mode==='additional'?' · '+money(divRound(exact(c.amount),100n).toString(),r.currency):'')+(c?.reference?' · '+c.reference:'');}
function packagingLabel(r){return ({unknown:'未知',requested:'买家要求 / 手工待核实',suggested:'有依据建议 · 待接受',accepted:'已接受方案 · 待采购确认',confirmed:'采购已确认',not_applicable:'不适用 · 已确认理由'})[packagingInfo(r).status]||'待核实';}
function invalidatePackaging(r,reason){const p=packagingInfo(r);r.packagingMeta={status:r.packaging?'accepted':'unknown',proposal:p.proposal||null,previousConfirmation:p.confirmedBy?{by:p.confirmedBy,at:p.confirmedAt,evidence:p.evidence}:p.previousConfirmation||null,evidence:reason,cost:{mode:'unknown'}};return r;}
function suggestionBasis(r){return JSON.stringify({scenario:r.scenario,lines:r.lines,currency:r.currency});}
function packagingSuggestion(r){
 if(!['德国','法国'].includes(r.scenario.market)||r.lines.length!==1)return null;

function outputIssues(q,a){const r=q.revisions.find(v=>v.id===a.revisionId);const found=issues(r);if(!a.profile?.supported)found.push({title:'通用模板回退：平台适配待核实',field:'output',severity:'pending'});if(knowledgeEvidence('术语',r.scenario).status!=='bound')found.push({title:'术语依据缺失或尚未绑定离线模板',description:'请恢复有效的合成术语版本，再重新生成；任意正文发布不能代替模板绑定。',field:'output',severity:'pending'});if(a.text.includes('[Original term / 原文待译]'))found.push({title:'正文仍有原文待译条款',description:'在编辑正文中补充目标语言翻译，逐项核对条件后另存新产出；未译文本不可送审。',field:'output',severity:'block'});for(const key of a.sourceIds){const k=state.knowledge.find(x=>x.id===key);if(!k||k.status!=='published'||k.valid<frozenDate||activeKnowledge(k.kind,r.scenario)?.id!==key)found.push({title:'产出引用的知识版本已变更或失效',description:'先恢复或发布有效依据，然后重新生成产出；旧正文和审批保留为历史。',field:'output',severity:'pending'});}return found;}
function status(q){const r=latest(q),a=currentArtifact(q,r),ap=approval(q,a);if(ap&&outputIssues(q,a).length)return ['需重新核实','amber'];if(ap)return [ap.sent?'已模拟发送':'已审核（演示）','green'];if(a&&outputIssues(q,a).length)return ['产出待复核','amber'];if(a?.review==='submitted')return ['待人工审核','orange'];if(issues(r).length)return ['待确认','amber'];return ['可生成产出','green'];}

function assistantView(q,r,history){const running=state.runs.find(x=>x.quoteId===q.id&&x.status==='running');return panel('报价助手',`<div class="note">离线脚本替身 · 不调用模型。请选择下方样例或按“数量改为…”“付款改为…”“交期改为…”输入；无法识别时会要求澄清。</div><div class="spacer"></div><div class="chat">${q.turns.length?q.turns.slice(-6).map(t=>`<div class="bubble user"><small>业务员</small>${esc(t.input)}</div><div class="bubble"><small>模拟助手 · ${esc(t.at)}</small>${esc(t.output)}</div>`).join(''):'<div class="bubble">我可以辅助修改草稿。金额由确定性模块计算，每次成功修改保存新版本。先试试把数量改成120。</div>'}</div><div class="suggestions">${btn('数量改为120 '+esc(r.lines[0].product.unit),'prompt',`data-text="数量改为120 ${esc(r.lines[0].product.unit)}"`,'small')}${btn('付款与交期','prompt','data-text="付款改为30%预付、70%发货前付清；交期改为确认后30天交货"','small')}${btn('未知请求','prompt','data-text="加礼盒并保证明天到货"','small')}</div><label>修改要求<textarea id="agent-input" placeholder="例如：数量改为120（沿用本单单位）" ${history||running?'disabled':''}></textarea></label><div class="spacer"></div>${running?`<div class="progress" aria-label="模拟运行中"><i></i></div><div class="row">${badge('运行中','orange')}${btn('取消此次运行','cancel-run',`data-id="${running.id}"`,'small')}</div>`:btn('理解修改并保存新版本','agent-revise',history?'disabled title="历史版本只读"':'','primary')}<div class="page-help">${history?'历史版本只读。请返回当前版本继续。':'模型只能提出建议；包装与费用使用单据中的采购人工确认。'}</div>`)+panel('下一步',`<div class="stack">${issues(latest(q)).slice(0,3).map(i=>`<button data-action="focus-issue" data-field="${i.field}" style="text-align:left">${badge(i.severity==='block'?'阻断':'待核实',i.severity==='block'?'red':'amber')} ${esc(i.title)}</button>`).join('')||'<div class="note success">报价字段检查通过；请生成产出，再核对语言、来源与送审条件。</div>'}${btn('打开确认任务','nav','data-page="tasks"','small')}${btn('查看运行记录','nav','data-page="runs"','small')}</div>`);}
function checksView(q,r){const found=issues(r),report=[...q.reports].reverse().find(x=>x.revisionId===r.id);return `<div class="row">${badge('合同条款 '+(knowledgeEvidence('合同条款',r.scenario).status==='bound'?'已绑定检查':'待核实'),knowledgeEvidence('合同条款',r.scenario).status==='bound'?'green':'amber')}${badge('目标市场 '+(knowledgeEvidence('目标市场',r.scenario).status==='bound'?'已绑定检查':'待核实'),knowledgeEvidence('目标市场',r.scenario).status==='bound'?'green':'amber')}${badge('仅合成规则','orange')}</div><p class="page-help">风险标记与下方文本批注来自同一个问题ID。规则根据当前有效发布版本重新评估；旧报告仍保留。只有原文、正文和适用范围匹配的合成检查才可执行。</p><details><summary>展开检查与知识原文的依据链</summary>${evidenceView(['合同条款','目标市场'].map(kind=>knowledgeEvidence(kind,r.scenario)))}</details><div class="spacer"></div>${found.map(i=>`<div class="issue ${i.severity==='block'?'block':''}"><div class="issue-title"><h3>${esc(i.title)}</h3>${badge(i.severity==='block'?'阻断':'待核实',i.severity==='block'?'red':'amber')}</div><p>${esc(i.description)}</p><small>${esc(i.category)} · ${esc(i.field)} · ID ${esc(i.id.slice(-25))}</small><div class="row">${btn('定位字段','focus-issue',`data-field="${i.field}"`,'small')}${i.source?btn('查看规则依据','source-knowledge',`data-id="${i.source}"`,'small'):''}${btn('处理此项','resolve-task',`data-quote="${q.id}" data-field="${i.field}"`,'small')}</div></div>`).join('')||'<div class="note success">演示规则范围内无阻断或关键待确认项。此结果不表示真实市场或法律合规。</div>'}<div class="spacer"></div>${btn('重新检查并保存报告','check',r.id!==latest(q).id?'disabled':'','primary')}<p class="page-help">${report?'最近已存报告：'+esc(report.at)+'，当时有'+report.issues.length+'项问题，规则版本已冻结。':'尚未保存当前版本的检查报告，当前显示实时预览。'} 共保存 ${q.reports.length} 份历史报告。</p>${q.reports.length?btn('查看历史检查报告','reports','','small'):''}`;}
function diffRows(before,after){const rows=[];const add=(field,a,b)=>{if(a!==b)rows.push([field,String(a??'未知'),String(b??'未知')]);};for(const l of after.lines){const old=before.lines.find(x=>x.product.id===l.product.id);add(l.product.sku+' 数量',old?.quantity??'无',l.quantity);}for(const l of before.lines)if(!after.lines.some(x=>x.product.id===l.product.id))add(l.product.sku,'存在','移除');for(const [key,title] of [['payment','付款'],['delivery','交期'],['packaging','包装'],['fees','费用'],['feesConfirmed','费用确认'],['mode','定价模式'],['margin','目标毛利'],['discount','折扣'],['currency','币种'],['fx','汇率']])add(title,before[key],after[key]);for(const [key,title] of [['market','目标市场'],['platform','业务平台'],['category','商品范围'],['languages','目标语言说明']])add(title,before.scenario[key],after.scenario[key]);add('包装确认状态',packagingLabel(before),packagingLabel(after));add('包装确认人',packagingInfo(before).confirmedBy,packagingInfo(after).confirmedBy);add('包装费用处理',packagingCostLabel(before),packagingCostLabel(after));add('包装依据',packagingInfo(before).evidence,packagingInfo(after).evidence);const a=compute(before),b=compute(after);add('包装费',money(a.packing,before.currency),money(b.packing,after.currency));add('商品合计',money(a.goods,before.currency),money(b.goods,after.currency));add('完整总额',money(a.total,before.currency),money(b.total,after.currency));return rows;}
function versionsView(q,r){const base=q.revisions[Math.max(0,r.version-2)];return `<div class="row"><label>查看版本<select id="version-select" class="version-select">${[...q.revisions].reverse().map(v=>`<option value="${v.id}" ${v.id===r.id?'selected':''}>V${v.version}${v.id===latest(q).id?' · 当前':''}</option>`).join('')}</select></label>${btn('恢复此版为新版本','restore-version',r.id===latest(q).id?'disabled title="请选择历史版本"':'','small')}</div><div class="spacer"></div><div class="note">V${r.version} · ${esc(r.reason)} · ${esc(r.created)}。历史不可改写，恢复会新建版本并重新审核。</div><div class="spacer"></div><h3>与${r.version===1?'初始版本':'父版本 V'+base.version}比较</h3><div class="table-wrap"><table><thead><tr><th>字段</th><th>修改前</th><th>修改后</th></tr></thead><tbody>${r.version===1?'<tr><td colspan="3">V1 是首个事实快照，没有前一版本。</td></tr>':diffRows(base,r).map(([field,a,b])=>`<tr><td>${esc(field)}</td><td>${esc(a)}</td><td><strong>${esc(b)}</strong></td></tr>`).join('')}</tbody></table></div><div class="spacer"></div><div class="timeline">${[...q.revisions].reverse().map(v=>`<div class="event"><strong>V${v.version} · ${esc(v.reason)}</strong><small>${esc(v.created)} · ${money(compute(v).goods,v.currency)}</small>${btn('查看快照','view-version',`data-id="${v.id}"`,'link small')}</div>`).join('')}</div>`;}
function sourcesView(q,r){return `<h3>询盘原文 → 识别字段 → 发布依据</h3><div class="spacer"></div>${inquiryEvidenceView(r)}<div class="spacer"></div><div class="note">商品及价格依据冻结在这个报价版本中。检查报告另行冻结所用知识版本；更新资料不覆盖历史报价。</div><div class="spacer"></div><div class="stack">${r.lines.map(l=>`<div class="source-card"><h3>${esc(l.product.sku)} · ${esc(l.product.source)}</h3><small>CSV 第${l.product.line}行 · 有效至 ${esc(l.product.valid)} · 合成来源</small><div class="spacer"></div>${btn('打开原始依据','source-product',`data-id="${l.product.id}"`,'small')}</div>`).join('')}</div><div class="spacer"></div><h3>当前适用知识</h3>${['合同条款','目标市场','术语'].map(kind=>{const k=activeKnowledge(kind,r.scenario);return `<p class="page-help">${kind}：${k?`${esc(k.title)} V${k.version} ${btn('回读原文','source-knowledge',`data-id="${k.id}"`,'link small')}`:'未找到可用发布版本'}</p>`;}).join('')}`;}
function catalogPage(){return panel('商品与价目表',`<div class="note">原始资料 → 预览纠错 → 人工发布。只有已发布商品可用于新报价。快照中的旧商品不会被后续资料改变。</div><div class="spacer"></div><div class="table-wrap"><table><thead><tr><th>商品</th><th>品类 / 单位</th><th>数量档位（USD）</th><th>有效期</th><th>来源</th></tr></thead><tbody>${state.products.map(p=>`<tr><td><strong>${esc(p.name)}</strong><small>${esc(p.sku)}</small></td><td>${esc(p.category)}<small>${esc(p.unit)}</small></td><td>${p.tiers.map(t=>`≥ ${esc(t.min)}：${t.price===null?badge('价格未知','amber'):esc(t.price)}`).join('<br>')}</td><td>${esc(p.valid)}<small>按演示日 ${frozenDate} 判断</small></td><td>${btn('查看原文','source-product',`data-id="${p.id}"`,'small')}${badge('合成数据')}</td></tr>`).join('')||'<tr><td colspan="5">尚未发布商品，请先导入CSV。</td></tr>'}</tbody></table></div>`,btn('＋ 导入资料','import-csv','','primary'))+panel('导入记录',state.batches.length?`<div class="table-wrap"><table><thead><tr><th>资料 / 时间</th><th>预览结果</th><th>状态</th><th>操作</th></tr></thead><tbody>${[...state.batches].reverse().map(b=>`<tr><td>${esc(b.name)}<small>${esc(b.at)}</small></td><td>${b.products.length} 个商品 / ${b.errors.length} 个问题</td><td>${badge(b.status==='published'?'已人工发布':b.errors.length?'待纠错':'待发布',b.status==='published'?'green':'amber')}</td><td>${btn('查看预览','batch',`data-id="${b.id}"`,'small')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>可从一份样本开始</strong><span>内置商品用于直接体验；导入向导可重新演练原文、预览、发布流程。</span></div>');}
function knowledgePage(){return panel('业务知识库',`<div class="row"><input id="knowledge-search" type="search" aria-label="搜索知识" placeholder="搜索标题、正文或来源" style="max-width:320px"><select id="knowledge-filter" aria-label="按状态筛选" style="width:150px"><option value="all">全部状态</option><option value="candidate">候选 / 待审核</option><option value="approved">审核通过待发布</option><option value="published">已发布</option><option value="withdrawn">已撤回</option></select></div><div class="spacer"></div><div class="note warning">业务知识属于应用运行数据；与仓库工程Wiki隔离。下面的规则和术语全部为合成样本。</div><div class="spacer"></div><div id="knowledge-results">${knowledgeList()}</div>`,btn('＋ 整理知识候选','new-knowledge','','primary'))+panel('知识维护',`<div class="row">${btn('检查知识库','lint-knowledge')}${btn('查看维护问题','maintenance')}</div><p class="page-help">发现过期、缺来源或撤回时，保留旧版本并建立复核提示。模拟检查不会自动改写报价或审批。</p>`);}
function knowledgeList(search='',filter='all'){const rows=state.knowledge.filter(k=>(filter==='all'||k.status===filter)&&`${k.title} ${k.body} ${k.source}`.toLowerCase().includes(search.toLowerCase()));const labels={candidate:'候选待审核',approved:'审核通过待发布',published:'已发布',withdrawn:'已撤回',rejected:'已驳回'};return `<div class="table-wrap"><table><thead><tr><th>知识 / 版本</th><th>类型 / 范围</th><th>有效期 / 状态</th><th>操作</th></tr></thead><tbody>${rows.map(k=>`<tr><td><strong>${esc(k.title)}</strong><small>V${k.version} · ${esc(k.source)}</small></td><td>${esc(k.kind)}<small>${esc(k.scope)}</small></td><td>${esc(k.valid)}<br>${badge(labels[k.status],k.status==='published'?'green':k.status==='withdrawn'||k.status==='rejected'?'red':'amber')}</td><td><div class="row">${btn('查看 / 审核','source-knowledge',`data-id="${k.id}"`,'small')}${btn('创建修订','revise-knowledge',`data-id="${k.id}"`,'small')}</div></td></tr>`).join('')||'<tr><td colspan="4">没有匹配知识。</td></tr>'}</tbody></table></div>`;}
function maintenanceIssues(){return state.knowledge.filter(k=>k.status==='published'&&(!k.source.trim()||!k.original.trim()||k.valid<frozenDate)).map(k=>({id:k.id,title:k.title,reason:k.valid<frozenDate?'知识有效期已过':'原始来源不完整'})).concat(['合同条款','目标市场'].filter(kind=>knowledgeEvidence(kind,state.scenario).status!=='bound').map(kind=>({id:null,title:kind,reason:'当前场景缺少有效发布规则或检查绑定'})));}
function tasksPage(){const tasks=allTasks();return panel('内部确认任务',`<div class="row">${badge(tasks.length+' 项待处理','amber')}${badge('业务员 '+tasks.filter(t=>t.owner==='业务员').length)}${badge('采购 '+tasks.filter(t=>t.owner==='采购').length)}</div><p class="page-help">从当前报价的实际缺项派生，不另造一套风险结果。事实确认保存报价新版本；产出问题另存或重生成产出，知识问题进入发布维护。旧记录保留。</p><div class="spacer"></div><div class="stack">${tasks.map(t=>`<div class="issue ${t.severity==='block'?'block':''}"><div class="issue-title"><div><h3>${esc(t.title)}</h3><small>${t.number} · V${t.version} · 负责岗位 ${t.owner}</small></div>${badge(t.severity==='block'?'阻断':'待核实',t.severity==='block'?'red':'amber')}</div><p>${esc(t.description)}</p><div class="row">${btn(t.field==='output'?'处理产出问题':t.field==='knowledge'?'维护适用知识':'处理并保存新版本','resolve-task',`data-quote="${t.quoteId}" data-field="${t.field}"`,'primary small')}${btn('打开关联报价','select-quote',`data-id="${t.quoteId}"`,'small')}${t.source?btn('依据','source-knowledge',`data-id="${t.source}"`,'small'):''}</div></div>`).join('')||'<div class="empty"><strong>当前没有待确认事项</strong><span>下一步生成目标语言产出并人工审核；之后修改事实会重新计算任务。</span>'+btn('前往审核与输出','nav','data-page="outputs"','primary')+'</div>'}</div>`)+panel('岗位协作如何流转',`<div class="grid3"><div><h3>业务员</h3><p class="page-help">确认客户意图、付款和商品选择，核对目标语言表达。</p></div><div><h3>采购</h3><p class="page-help">提供费用和交期依据。确认结果进入新报价版本。</p></div><div><h3>主管</h3><p class="page-help">审核指定报价版本与对外产出。这里的岗位是演示标签，不构成真实权限。</p></div></div>`);}
function outputsPage(){const q=current(),r=latest(q);if(!q)return panel('审核与输出','<div class="empty">请先建立报价。</div>',btn('新建询盘','new-quote','','primary'));const a=currentArtifact(q,r),ap=approval(q,a),problems=a?outputIssues(q,a):issues(r);return panel('生成与审核对外产出',`<div class="field-grid">${select('报价单','outputQuote',state.quotes.map(x=>[x.id,x.number+' · '+x.buyer]),q.id)}${select('目标语言','outputLanguage',[['en','英语 · 模拟模板'],['de','德语 · 模拟模板'],['zh','中文 · 核对模板'],['other','其他目标语言']],q.outputSelection?.language||a?.language||'en')}${field('其他语言代码（选择其他时填写）','customLanguage',q.outputSelection?.customLanguage||'fr','text','maxlength="35" placeholder="例如 fr / ja / ar"')}${select('输出场景','outputScene',[['rfq','RFQ 简短回复'],['email','正式邮件报价']],q.outputSelection?.scene||a?.scene||'rfq')}<div class="stack"><small>固定事实版本</small><strong>${q.number} · V${r.version}</strong></div></div><div class="spacer"></div><div class="row">${btn('生成新的产出草稿','generate-output','','primary')}${q.artifacts.length?btn('查看产出历史','output-history','','small'):''}</div><p class="page-help">仅en/de/zh有离线模板；其他语言可提出请求，但明确返回未支持，不生成伪翻译。RFQ为摘要与追问，正式邮件为详细报价与条件。每次生成或编辑都重新审核。</p>${q.languageRequests?.length?`<div class="note warning">最近语言请求：${esc(q.languageRequests.at(-1).language)} · ${esc(q.languageRequests.at(-1).message)}；该次请求未生成产出。</div>`:''}`,badge(problems.length?'仍有'+problems.length+'项待确认':a?'可准备审核':'请先生成产出',problems.length?'amber':'green'))+(a?`<div class="grid2"><div>${panel(`${a.language.toUpperCase()} · ${a.scene==='rfq'?'RFQ 简短回复':'正式邮件报价'}`,`<div class="note ${a.profile?.supported?'':'warning'}">${esc(a.profile?.label||'旧版模板，未记录平台适配')} · ${esc(r.scenario.platform)}；仅合成风格演示，不代表平台或语言质量验收。</div><div class="spacer"></div><div class="output-paper">${esc(a.text)}</div>${a.manuallyEdited?'<p class="note warning">此正文由人工编辑，报价快照未改变；送审与主管审批须逐项对照单据，本样机未自动证明事实一致。</p>':''}<p class="page-help">产出 ${esc(a.id.slice(-8))} · 绑定 V${r.version} · ${esc(a.created)}<br>内容指纹 ${fingerprint(a.text)}（演示标识，非生产校验）</p><div class="row function settingsPage(){return `<div class="grid2">${panel('工作区与场景',`<form id="settings-form" class="stack">${field('工作区名称','workspace',state.workspace,'text','required maxlength="80"')}<div class="field-grid">${field('业务平台','platform',state.scenario.platform,'text','required maxlength="80"')}${field('目标市场','market',state.scenario.market,'text','required maxlength="80"')}${field('商品范围','category',state.scenario.category,'text','required maxlength="80"')}${field('目标语言说明','languages',state.scenario.languages,'text','required maxlength="80"')}</div><div class="note">新场景仅用于新报价；旧版本保存原场景。当前合成目标市场规则适用于德国，其他市场需要自己的发布依据。</div><button type="submit" class="primary">保存工作区设置</button></form>`)}${panel('模型模拟与故障注入',`<form id="model-form" class="stack">${select('模型替身','model',[['DeepSeek（离线替身）','DeepSeek（离线替身）']],state.settings.model)}${select('下一次请求的结果','failure',[['none','正常返回'],['timeout','模拟超时'],['auth','模拟鉴权失败'],['invalid','模拟非法结构']],state.settings.failure)}${select('模拟响应延迟','delay',[['600','0.6秒'],['1800','1.8秒'],['8000','8秒 · 便于取消/重开']],state.settings.delay)}<div class="note">不填写API Key，不发送网络请求。故障注入使用一次后自动恢复正常；真实供应商测试需要正式桌面应用。</div><div class="row"><button type="submit" class="primary">保存模拟配置</button>${btn('测试模拟连接','test-model')}</div></form>`)}</div>`+panel('演示数据维护',`<div class="row">${btn('下载演示备份 JSON','backup')}${btn('恢复演示备份','restore-backup')}${btn('重置为预置样本','reset','','danger')}${btn('清空并从头演练','empty-reset','','danger')}</div><p class="page-help">仅包含本HTML的合成数据，无真实账户、密钥或数据库。恢复会先展示数量并确认；不会访问其他应用数据。</p>`);}
function fingerprint(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619);}return 'demo-'+(h>>>0).toString(16).padStart(8,'0');}
function localizedTerm(value,language){if(!value)return language==='de'?'Noch zu bestätigen':language==='en'?'To be confirmed':'待确认';if(language==='zh')return value;const terms={
'30%预付、70%发货前付清':['30% advance payment, 70% before shipment','30 % Vorauszahlung, 70 % vor dem Versand'],
'30%预付，70%发货前付清':['30% advance payment, 70% before shipment','30 % Vorauszahlung, 70 % vor dem Versand'],
'确认后30天交货':['Delivery within 30 days after confirmation','Lieferung innerhalb von 30 Tagen nach Bestätigung'],
'确认后30天交货，具体日期双方确认':['Delivery within 30 days after confirmation; exact date subject to mutual agreement','Lieferung innerhalb von 30 Tagen nach Bestätigung; genauer Termin nach gemeinsamer Vereinbarung'],
'标准纸箱（合成资料）':['Standard cartons (synthetic specification)','Standardkartons (synthetische Spezifikation)'],
'标准纸箱，包装费用已计入':['Standard cartons; packaging costs included','Standardkartons; Verpackungskosten enthalten']};return terms[value]?.[language==='de'?1:0]||'[Original term / 原文待译] '+value;}
function languageCode(value){const code=String(value).trim().toLowerCase();if(!/^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$/.test(code)||code.length>35)throw Error('请填写语言代码，如 fr、ja、ar 或 pt-BR。');return code;}
function outputProfile(r,language,scene){return {supported:r.scenario.platform==='阿里国际站 RFQ',label:(scene==='rfq'?'RFQ 摘要与追问':'邮件详细报价')+' · '+language.toUpperCase()+(r.scenario.platform==='阿里国际站 RFQ'?' 合成场景模板':' 通用回退（平台适配待核实）')};}
function outputText(q,r,language,scene){
 if(!['en','de','zh'].includes(language))throw Error('此语言暂无离线模板，未生成产出；正式产品需模型辅助及人工复核。');
 if(!['rfq','email'].includes(scene))throw Error('未知输出场景');
 const c=compute(r),de=language==='de',zh=language==='zh';
 const word=(en,german,chinese)=>zh?chinese:de?german:en;
 const term=value=>localizedTerm(value,language);
 const pending=word('To be confirmed','Noch zu bestätigen','待确认');
 const localNumber=value=>de?String(value).replace('.',','):String(value);
 const amount=value=>{if(value===null)return pending;const text=money(value,r.currency);return de?text.replace(/,/g,'#').replace('.',',').replace(/#/g,'.'):text;};
 const price=value=>value===null?pending:r.currency+' '+localNumber(value.replace(/(\.\d{2})0+$/,'$1'));
 const questions=[];
 for(const [key,en,german,chinese] of [['payment','payment terms','Zahlungsbedingungen','付款'],['delivery','delivery conditions','Lieferbedingungen','交期'],['packaging','packaging','Verpackung','包装']])if(!r[key])questions.push(word(en,german,chinese));
 if(!packagingReady(r))questions.push(word('procurement packaging confirmation','Verpackungsbestätigung durch den Einkauf','采购包装确认'));if(c.packing===null)questions.push(word('packaging cost','Verpackungskosten','包装费用'));if(c.fees===null)questions.push(word('freight/tax/other fees','Fracht/Steuern/Zusatzkosten','运税费'));
 const warning='[SYNTHETIC DEMO / 合成演示 · NOT FOR COMMERCIAL USE]\n固定离线模板；未识别条款保留原文待译，需人工核对。\n';
 const brief=c.lines.map(l=>`${l.product.sku}: ${localNumber(l.quantity)} ${l.product.unit} × ${price(l.unitPrice)}`).join('; ');
 const ask=questions.length?word('Please clarify: ','Bitte klären: ','请确认：')+questions.join(' / '):word('Please confirm these quantities and commercial terms.','Bitte bestätigen Sie Mengen und Konditionen.','请确认数量及商业条款。');
 if(scene==='rfq')return warning+word('RFQ response','RFQ-Antwort','RFQ简短回复')+` · ${q.number} / V${r.version}\n\n`+brief+'\n'+word('Goods subtotal: ','Warenwert: ','商品合计：')+amount(c.goods)+'\n'+word('Total incl. confirmed fees: ','Gesamt inkl. bestätigter Kosten: ','含已确认费用总额：')+(c.total===null?pending:amount(c.total))+'\n'+word('Payment / Delivery: ','Zahlung / Lieferung: ','付款 / 交期：')+term(r.payment)+' / '+term(r.delivery)+'\n'+word('Packaging: ','Verpackung: ','包装：')+(packagingReady(r)?'':word('[Requested; procurement unconfirmed] ','[Angefragt; Einkauf unbestätigt] ','[要求/建议，采购未确认] '))+term(r.packaging)+'\n\n'+ask+'\n'+word('Detailed packaging and fee breakdown will be included in the formal quotation.','Verpackung und Kostenaufschlüsselung folgen im ausführlichen Angebot.','详细包装及费用明细请查看正式报价邮件。');
 const lines=c.lines.map(l=>`${l.product.sku} | ${localNumber(l.quantity)} ${l.product.unit} | ${price(l.unitPrice)} | ${amount(l.amount)}`).join('\n');
 return warning+word('Subject: Quotation ','Betreff: Angebot ','主题：报价 ')+`${q.number} / V${r.version}\n\n`+word('Dear buyer,','Guten Tag,','您好，')+'\n'+word('Thank you for your enquiry. Please review the following quotation.','Vielen Dank für Ihre Anfrage. Bitte prüfen Sie das folgende Angebot.','感谢询盘，请核对以下报价。')+'\n\n1. '+word('Items and pricing','Artikel und Preise','商品与价格')+'\nSKU | '+word('Quantity | Unit price | Amount','Menge | Einzelpreis | Betrag','数量 | 单价 | 金额')+'\n'+lines+'\n\n2. '+word('Cost breakdown','Kostenübersicht','费用明细')+'\n'+word('Goods subtotal: ','Warenwert: ','商品合计：')+amount(c.goods)+'\n'+word('Additional fees: ','Zusatzkosten: ','运税费：')+amount(c.fees)+'\n'+word('Packaging fee: ','Verpackungskosten: ','另计包装费：')+amount(c.packing)+'\n'+word('Total: ','Gesamtbetrag: ','总额：')+(c.total===null?pending:amount(c.total))+'\n\n3. '+word('Commercial terms','Konditionen','商业条款')+'\n'+word('Payment: ','Zahlung: ','付款：')+term(r.payment)+'\n'+word('Delivery: ','Lieferung: ','交期：')+term(r.delivery)+'\n'+word('Packaging: ','Verpackung: ','包装：')+(packagingReady(r)?'':word('[Requested; procurement unconfirmed] ','[Angefragt; Einkauf unbestätigt] ','[要求/建议，采购未确认] '))+term(r.packaging)+'\n\n4. '+word('Confirmation required','Erforderliche Bestätigung','确认事项')+'\n'+ask+'\n'+word('No offer validity period or delivery guarantee is implied beyond the confirmed facts.','Ohne bestätigte Grundlage werden weder Angebotsgültigkeit noch Liefergarantie zugesagt.','未确认的报价有效期和保证交期不作承诺。')+'\n\n'+word('Best regards,','Mit freundlichen Grüßen','此致，')+'\nDemo Export Team';
}
function makeArtifact(q,language,scene,text){language=languageCode(language);if(!['en','de','zh'].includes(language))throw Error('此语言暂无离线模板，未生成产出；正式产品需模型辅助及人工复核。');const r=latest(q);const a={id:id('artifact'),revisionId:r.id,language,scene,profile:outputProfile(r,language,scene),text:text??outputText(q,r,language,scene),manuallyEdited:text!==undefined,created:now(),review:'draft',sourceIds:['合同条款','目标市场','术语'].map(kind=>activeKnowledge(kind,r.scenario)).filter(Boolean).map(k=>k.id)};q.artifacts.push(a);event(`${q.number} V${r.version} 新建 ${language}/${scene} 产出；未审核`);return a;}
function download(name,content,mime='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已创建本地下载；没有发送给任何人。');}
function outputHtml(q,a,approved){const r=q.revisions.find(v=>v.id===a.revisionId);return `<!doctype html><html lang="${esc(a.language)}"><meta charset="utf-8"><title>${esc(q.number)} V${r.version} · 合成演示</title><style>body{font:15px/1.8 system-ui,sans-serif;max-width:780px;margin:50px auto;padding:20px}pre{white-space:pre-wrap;font:inherit;border-top:1px solid #ddd;padding-top:24px}.stamp{border:2px solid #cc3a05;padding:12px;color:#a12e05}small{color:#555}@media print{body{margin:15mm;max-width:none}button{display:none}}</style><div class="stamp">${approved?'已模拟审核 · 仅教学用途':'未审核草稿 · 不可用于交易'}<br>全部为合成数据 / SYNTHETIC DEMO</div><h1>${esc(q.number)} · V${r.version}</h1><small>产出 ${esc(a.id)} · ${esc(a.created)}</small><pre>${esc(a.text)}</pre></html>`;}
function showDialog(title,body,submitLabel=null,handler=null){lastFocus=document.activeElement;dialogHandler=handler;$('#dialog').innerHTML=`<form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title">${title}</h2>${btn('关闭 ×','close-dialog','','small')}</div><div class="dialog-body">${body}</div><div id="dialog-error" class="dialog-error" role="alert"></div><div class="dialog-foot">${btn(submitLabel?'取消':'关闭','close-dialog')}${submitLabel?`<button type="submit" class="primary">${submitLabel}</button>`:''}</div></form>`;if(!$('#dialog').open)$('#dialog').showModal();setTimeout(()=>$('#dialog').querySelector('input:not([type=hidden]),textarea,select,button')?.focus(),0);}

function analyzeInquiry(input,scenario=state.scenario){
 const fields=[],questions=[],values={},segments=input.split(/[；;\n]/);let offset=0,product=null,quantity=null,unit=null,hasProduct=false;
 for(const raw of segments){
  const part=raw.trim(),start=offset+raw.indexOf(part);offset+=raw.length+1;if(!part)continue;
  const record=(label,value)=>fields.push({label,value,start,end:start+part.length,snippet:input.slice(start,start+part.length)});
  if(part.startsWith('请报价 ')){
   if(hasProduct){questions.push('本次离线识别只演示单商品；多商品请使用人工建单。');continue;}hasProduct=true;
   const m=part.match(/^请报价\s+(.+?)\s+(\d+(?:\.\d{1,4})?)\s+([a-zA-Z][a-zA-Z0-9_-]*)$/);
   const query=m?m[1]:part.slice(4).trim();const candidates=state.products.filter(p=>p.sku.toLowerCase()===query.toLowerCase()||p.name===query);
   if(candidates.length===1)product=candidates[0];else{
    const possible=state.products.filter(p=>p.sku.toLowerCase().includes(query.toLowerCase())||p.name.includes(query));
    questions.push('请明确一个已发布SKU'+(possible.length?'，候选：'+possible.map(p=>p.sku).join('、'):'；未找到匹配商品，不能自动替换')+'。');
   }
   if(!m)questions.push('请补充数量和单位，格式：请报价 SKU 数量 单位。');
   else{quantity=m[2];unit=m[3];try{exact(quantity,false);}catch{questions.push('数量必须是正数且在演示范围内。');}if(product&&product.unit!==unit)questions.push('单位与发布商品不一致，请核实 '+product.unit+'，不能隐式换算。');record('商品',product?.sku||query);record('数量',quantity+' '+unit);}
  }else{
   const m=part.match(/^(付款|交期|包装)[：:]\s*(.+)$/),key=m&&({付款:'payment',交期:'delivery',包装:'packaging'}[m[1]]);
   if(!m)questions.push('未识别片段：“'+part+'”。请补充支持的明确字段，或使用人工建单。');
   else if(values[key]!==undefined)questions.push(m[1]+'重复，请先消除歧义。');
   else{values[key]=/^(待确认|未知|待采购确认)$/.test(m[2].trim())?'':m[2].trim();record(m[1],values[key]||'待确认');}
  }
 }
 if(!hasProduct)questions.push('请明确商品、数量、单位，格式：请报价 SKU 数量 单位。');
 const knowledge=['合同条款','目标市场','术语'].map(kind=>knowledgeEvidence(kind,scenario));
 const missing=['payment','delivery','packaging'].filter(key=>!values[key]).map(key=>({payment:'付款',delivery:'交期',packaging:'包装'}[key])).concat('运税费');
 return {input,scenario:clone(scenario),fields,questions,missing,product:product?clone(product):null,quantity,unit,values,knowledge};
}
function inquiryPayload(result,buyer){
 if(result.questions.length||!result.product||!result.quantity)throw Error('请先澄清识别问题，尚未建立报价。');
 return {buyer,inquiry:result.input,scenario:clone(result.scenario),lines:[{product:clone(result.product),quantity:result.quantity}],...result.values,inquiryEvidence:{fields:clone(result.fields),product:clone(result.product),knowledge:clone(result.knowledge)}};
}

function inquiryPreview(result,buyer){

  const payload=inquiryPayload(result,buyer);startRun({kind:'understand',input:result.input,payload});closeDialog();go('runs');
 }:null);
}

function editQuoteDialog(q=current(),focusField=null){const base=latest(q);if(!base)return;showDialog(`编辑 ${q.number} · 另存为 V${base.version+1}`,`<div class="stack">${productLineEditor(base.lines)}<div class="field-grid">${select('定价模式','mode',[['sales','销售价目表'],['cost','成本核价（模拟）']],base.mode)}${select('报价币种','currency',[['USD','USD'],['EUR','EUR'],['CNY','CNY']],base.currency)}${field('固定演示汇率 / 1 USD','fx',base.fx,'text','required inputmode="decimal"')}${field('目标毛利率 %（成本模式）','margin',base.margin,'text','required inputmode="decimal"')}${field('行折扣 %','discount',base.discount,'text','required inputmode="decimal"')}${field('已核定费用（报价币种）','fees',base.fees,'text','required inputmode="decimal"')}${textfield('付款条款','payment',base.payment,'maxlength="1000"')}${textfield('交期 / 交货条件','delivery',base.delivery,'maxlength="1000"')}${field('包装要求（修改后须重新采购确认）','packaging',base.packaging,'text','maxlength="500"')}<label class="checkline"><input type="checkbox" name="feesConfirmed"><span>本次已按当前商品、数量、币种、包装与交期重新核对运税费（明确0也须确认）</span></label></div><p class="page-help">未勾选时，仅在计费事实未改变的情况下保留原费用确认；改变数量、币种、包装、交期或费用金额后需重新核对。</p>${field('本次变更说明','reason','人工补充业务事实','text','required maxlength="200"')}<div class="note">旧版本不变。金额按十进制定点数计算，逐行舍入；本样机演示的成本/费用能力不代表正式项目已经实现。</div></div>`,'保存新版本',form=>{if(latest(q).id!==base.id)throw Error('报价已经产生新版本。请关闭并重新打开编辑，避免覆盖。');const data=Object.fromEntries(new FormData(form));if(exact(data.fx,false)===0n)throw Error('汇率必须大于0');const next={...base,...data,feesConfirmed:base.feesConfirmed||form.elements.feesConfirmed.checked,lines:readLines(form,base)};if(!diffRows(base,next).length)throw Error('没有字段变化，无需新建版本。');saveRevision(q,next,data.reason,{confirmFees:form.elements.feesConfirmed.checked});selected=q.id;page='quotes';tab='detail';closeDialog();render();toast('已保存新版本；旧产出与审批保留，新版本需要重新检查。');});if(focusField)setTimeout(()=>$('#dialog').querySelector(`[name="${focusField}"]`)?.focus(),30);}
function parseCsv(raw){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<raw.length;i++){const c=raw[i];if(c==='"'){if(quoted&&raw[i+1]==='"'){cell+='"';i++;}else if(!quoted&&cell)throw Error('CSV引号必须从字段开头开始。');else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);cell='';row=[];}else cell+=c;}if(quoted)throw Error('CSV存在未闭合引号。');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw Error('CSV至少包含表头和一行数据。');const headers=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim());const expected=['sku','name','category','unit','currency','min_quantity','unit_price','valid_until','description'];if(headers.length!==expected.length||new Set(headers).size!==headers.length||expected.some(x=>!headers.includes(x)))throw Error('需要固定九列：'+expected.join(', '));if(rows.length>500)throw Error('演示最多500行。');const products=[],errors=[];const grouped=new Map();rows.forEach((cells,index)=>{try{if(cells.length!==9)throw Error('列数不匹配');const row=Object.fromEntries(headers.map((h,i)=>[h,cells[i].trim()]));if(!row.sku||!row.name||!row.unit||!row.category)throw Error('SKU、名称、类别、单位不能为空');if(row.sku.length>100||row.name.length>200||row.description.length>2000)throw Error('字段长度超限');if(row.currency!=='USD')throw Error('此HTML导入样例只支持USD原价，再在报价中演示换汇');exact(row.min_quantity,false);if(row.unit_price)exact(row.unit_price);if(!/^\d{4}-\d{2}-\d{2}$/.test(row.valid_until)||Number.isNaN(Date.parse(row.valid_until))||new Date(row.valid_until).toISOString().slice(0,10)!==row.valid_until)throw Error('有效期不是合法日期');let p=grouped.get(row.sku);if(p&&[p.name!==row.name,p.unit!==row.unit,p.category!==row.category,p.valid!==row.valid_until].some(Boolean))throw Error('同SKU元信息不一致');if(!p){p={id:id('p'),sku:row.sku,name:row.name,category:row.category,unit:row.unit,currency:'USD',tiers:[],cost:null,valid:row.valid_until,description:row.description,source:'合成导入.csv',line:index+2};grouped.set(row.sku,p);products.push(p);}if(p.tiers.some(t=>exact(t.min)===exact(row.min_quantity)))throw Error('重复数量档位');p.tiers.push({min:row.min_quantity,price:row.unit_price||null});}catch(e){errors.push({line:index+2,message:e.message});}});for(const p of products)p.tiers.sort((a,b)=>exact(a.min)<exact(b.min)?-1:1);return {products,errors};}
function importDialog(){showDialog('导入合成商品资料',`<div class="stack">${field('资料名称','filename','合成导入.csv','text','required maxlength="100"')}<div class="row">${btn('填入另一组演示样本','fill-csv','','small')}<label class="file-label">选择 UTF-8 CSV<input type="file" id="csv-file" accept=".csv,text/csv"></label></div>${textfield('CSV原文 · 仅使用假数据','csv',SAMPLE_CSV.replaceAll('DEMO-','NEW-'),'required rows="10" maxlength="262144"')}<div class="note">仅CSV提供真正的本地解析预览；XLSX、PDF、DOCX是正式项目后续目标，此HTML不假装解析。当前已发布SKU不允许覆盖。</div></div>`,'解析并预览',form=>{const raw=form.elements.csv.value;if(new TextEncoder().encode(raw).length>262144)throw Error('文件不能超过256KiB。');const result=parseCsv(raw);const existing=state.batches.find(b=>b.raw===raw);if(existing){batchDialog(existing);return;}const b={id:id('batch'),name:form.elements.filename.value,raw,at:now(),status:'staged',...result};b.products.forEach(p=>p.source=b.name);state.batches.push(b);event('暂存资料 '+b.name+'；尚未发布');batchDialog(b);render();});}

function knowledgeDialog(base=null){showDialog(base?'创建知识修订 · V'+(Math.max(...state.knowledge.filter(k=>k.entry===base.entry).map(k=>k.version))+1):'整理知识候选',`<div class="stack"><div class="field-grid">${field('标题','title',base?.title||'合成包装确认流程','text','required maxlength="100"')}${select('知识类型','kind',[['合同条款','合同条款'],['目标市场','目标市场'],['术语','术语'],['SOP','SOP']],base?.kind||'SOP')}${field('适用范围（通用或目标市场）','scope',base?.scope||'通用','text','required maxlength="50"')}${field('有效至','valid',base?.valid||'2027-12-31','date','required')}${field('合成原件名称','source',base?.source||'合成包装流程.txt','text','required maxlength="120"')}</div>${textfield('原始资料 · AI回答不能作为原始证据','original',base?.original||'合成流程：销售应向采购确认包装方式与费用，采购确认后再向买家承诺。','required maxlength="5000"')}${btn('模拟AI整理为候选','compose-knowledge','','small')}${textfield('候选知识正文（人工可编辑）','body',base?.body||'包装与费用需要采购明确确认，未确认时保留待办，不默认免费。','required maxlength="5000"')}<div class="note">模拟AI只按原文生成候选；保存后仍需逐版本人工审核，再显式发布。</div></div>`,'保存待审核候选',form=>{const data=Object.fromEntries(new FormData(form));if(data.valid<frozenDate)throw Error('候选有效期不能早于演示日期。');const k={id:id('knowledge'),entry:base?.entry||id('entry'),version:base?Math.max(...state.knowledge.filter(k=>k.entry===base.entry).map(k=>k.version))+1:1,status:'candidate',...data,created:now()};state.knowledge.push(k);event('保存知识候选 '+k.title+' V'+k.version);closeDialog();render();toast('已保存候选，尚未发布。');});}
function knowledgeDetail(k){if(!k)throw Error('知识版本不存在');const labels={candidate:'候选待审核',approved:'审核通过待发布',published:'已发布',withdrawn:'已撤回',rejected:'已驳回'};showDialog('知识与原始来源',`<div class="stack"><div>${badge(labels[k.status],k.status==='published'?'green':'amber')} ${badge(k.kind)} ${badge('V'+k.version)}</div><h3>${esc(k.title)}</h3><p class="muted">${esc(k.scope)} · 有效至 ${esc(k.valid)} · ${esc(k.source)}</p><div class="grid2"><div><h3>原文依据</h3><div class="note text-block">${esc(k.original)}</div></div><div><h3>知识正文</h3><div class="note text-block">${esc(k.body)}</div></div></div>${k.rejection?`<div class="note error">驳回原因：${esc(k.rejection)}</div>`:''}<div class="note">发布不允许绕过来源和审核；原文或正文变更要新建候选版本。所有规则仅用于教学。只有与内置合成原文、正文及范围完全匹配的合同/市场知识可绑定演示检查；编辑正文不会自动编译规则，发布后需重新核实。</div><div class="row">${k.status==='candidate'?btn('人工审核通过','approve-knowledge',`data-id="${k.id}"`,'primary')+btn('驳回并说明','reject-knowledge',`data-id="${k.id}"`,'danger'):''}${k.status==='approved'?btn('显式发布此版本','publish-knowledge',`data-id="${k.id}"`,'primary'):''}${k.status==='published'?btn('撤回并产生复核提示','withdraw-knowledge',`data-id="${k.id}"`,'danger'):''}${btn('创建新修订','revise-knowledge',`data-id="${k.id}"`)}</div></div>`);}
function resolveTask(quoteId,fieldName){const q=state.quotes.find(q=>q.id===quoteId);if(!q)throw Error('关联报价不存在。');selected=q.id;if(fieldName==='output'){closeDialog();go('outputs');toast('请按产出问题列表补充翻译、核对依据或重新生成。');return;}if(fieldName==='knowledge'){closeDialog();go('knowledge');toast('请检查并发布适用的规则，随后重新检查报价。');return;}if(fieldName==='packaging'){if(packagingInfo(latest(q)).status==='suggested'){closeDialog();tab='detail';go('quotes');toast('请在包装面板先接受或拒绝建议。');}else packagingConfirmDialog(q);return;}if(fieldName==='lines'){editQuoteDialog(q);return;}const base=latest(q);let body='';if(fieldName==='fees')body=field('采购确认的费用（'+base.currency+'）','value','50','text','required inputmode="decimal"')+'<p class="page-help">模拟采购确认：金额可以为0，但必须明确确认；将新建报价版本。</p>';else body=textfield(fieldName==='payment'?'已确认付款条款':fieldName==='delivery'?'已确认交期与交货条件':'已确认包装说明','value',fieldName==='payment'?'30%预付，70%发货前付清':fieldName==='delivery'?'确认后30天交货，具体日期双方确认':'标准纸箱，包装费用已计入','required maxlength="1000"');showDialog('解决确认任务 · '+q.number,`<div class="stack">${body}${field('确认依据/说明','evidence','演示人员根据合成资料确认','text','required maxlength="300"')}<label class="checkline"><input type="checkbox" name="confirmed" required><span>我确认这是合成演示中的人工确认，不是模型自行补齐。</span></label></div>`,'确认并生成新版本',form=>{if(latest(q).id!==base.id)throw Error('报价已变化，请重新打开任务。');const data=Object.fromEntries(new FormData(form));const next={...clone(base)};if(fieldName==='fees'){exact(data.value);next.fees=data.value;next.feesConfirmed=true;}else next[fieldName]=data.value;saveRevision(q,next,`确认${fieldName}：${data.evidence}`,{confirmFees:fieldName==='fees'});closeDialog();render();toast('确认已进入新版本，任务与风险已重新计算。');});}
function parseInstruction(input,base){const patches={};for(const part of input.trim().replace(/[。.!！]+$/,'').split(/[;；\n]/).map(s=>s.trim()).filter(Boolean)){let m;if((m=part.match(/^数量(?:改为|调整为|改成)\s*(\d+(?:\.\d{1,4})?)\s*(件|个|piece|m2|m²|kg)?$/))){if(base.lines.length!==1)throw Error('多商品报价请用“编辑事实”明确选择商品，本演示不猜测数量属于哪一行。');if(patches.quantity!==undefined)throw Error('同一字段不能重复修改。');exact(m[1],false);const unit=m[2]&&({件:'piece',个:'piece','m²':'m2'}[m[2]]||m[2]);if(unit&&unit!==base.lines[0].product.unit)throw Error('需要澄清：数量单位与本单商品不一致，不进行隐式换算。未保存任何部分修改。');patches.quantity=m[1];}else if((m=part.match(/^付款(?:改为|改成)(.+)$/))){if(patches.payment!==undefined)throw Error('付款字段重复。');patches.payment=m[1].trim();}else if((m=part.match(/^交期(?:改为|改成)(.+)$/))){if(patches.delivery!==undefined)throw Error('交期字段重复。');patches.delivery=m[1].trim();}else throw Error('需要澄清：本离线演示仅识别“数量改为120件”“付款改为…”“交期改为…”，多项用分号分隔。包装、换品、改价等请用人工编辑。未保存任何部分修改。');}if(!Object.keys(patches).length)throw Error('请提供明确的修改要求。');return patches;}
function startRun({kind,input,quoteId=null,payload=null}){if(state.runs.some(r=>r.status==='running'&&r.quoteId===quoteId))throw Error('该单据已有运行，请先等待或取消。');const q=state.quotes.find(q=>q.id===quoteId);const run={id:id('run'),key:id('op'),kind,input,quoteId,payload,baseId:q?latest(q).id:null,status:'queued',attempt:0,created:now(),message:'排队',committed:null};state.runs.push(run);executeRun(run);return run;}
function executeRun(run){if(run.status==='completed'){toast('已回放原提交结果；没有再次生成版本或请求。');if(run.quoteId)selected=run.quoteId;return;}if(run.status==='running')throw Error('请求正在运行');if(run.status==='waiting_input')throw Error('请补充新的请求，不能无变化重试。');run.attempt++;run.status='running';run.message='模拟处理输入，尚未提交报价';const failure=state.settings.failure;state.settings.failure='none';event('开始模拟运行 '+run.key+'（尝试'+run.attempt+'）');const timer=setTimeout(()=>{timers.delete(run.id);if(run.status!=='running')return;try{if(failure!=='none')throw Error({timeout:'MODEL_TIMEOUT · 模拟请求超时，未保存新版本',auth:'MODEL_AUTH_FAILED · 模拟鉴权失败，未保存新版本',invalid:'MODEL_INVALID_OUTPUT · 模拟结构非法，未保存新版本'}[failure]);if(run.kind==='connection'){run.status='completed';run.message='离线连接替身成功；没有访问DeepSeek，也未验证业务语义。';}else if(run.kind==='understand'){if(!run.payload.inquiryEvidence)throw Error('旧版识别请求没有原文依据，请重新发起识别。');for(const l of run.payload.lines){const p=state.products.find(p=>p.id===l.product.id);if(!p||JSON.stringify(p)!==JSON.stringify(l.product))throw Error('商品依据已变化，请重新识别。');}for(const e of run.payload.inquiryEvidence.knowledge){const current=knowledgeEvidence(e.kind,run.payload.scenario);if(JSON.stringify(current)!==JSON.stringify(e))throw Error('知识依据已变化，请重新识别。');}const q=newQuote(run.payload);run.quoteId=q.id;run.committed=latest(q).id;run.status='completed';run.message='已按核对的原文识别结果保存 V1；依据与缺项已冻结';q.turns.push({input:run.input,output:run.message,at:now()});}else{const q=state.quotes.find(q=>q.id===run.quoteId);if(!q)throw Error('关联报价不存在');if(latest(q).id!==run.baseId)throw Error('REVISION_CONFLICT · 基线已有新版本，请重新读取后发起新请求。');const base=latest(q);let patches;try{patches=parseInstruction(run.input,base);}catch(error){run.status='waiting_input';run.message=error.message;event('运行需要澄清，未保存版本');render();toast(run.message,true);return;}const next=clone(base);if(patches.quantity)next.lines[0].quantity=patches.quantity;if(patches.payment!==undefined)next.payment=patches.payment;if(patches.delivery!==undefined)next.delivery=patches.delivery;if(!diffRows(base,next).length)throw Error('没有事实变化，未重复生成版本。');const r=saveRevision(q,next,run.input);run.committed=r.id;run.status='completed';run.message='已保存为 V'+r.version+'；业务模块重新计算，旧版保留';q.turns.push({input:run.input,output:run.message,at:now()});}event('运行完成：'+run.message);toast(run.message);}catch(error){run.status='failed';run.message=error.message;event('运行失败：'+run.message);toast(run.message,true);}persist();render();},Number(state.settings.delay));timers.set(run.id,timer);persist();}
function cancelRun(run){if(!run)throw Error('运行不存在');if(run.status==='completed'){toast('已提交结果保留，取消不能撤销完成事实。');return;}if(run.status!=='running')throw Error('只有运行中任务可以取消');clearTimeout(timers.get(run.id));timers.delete(run.id);run.status='cancelled';run.message='用户取消，未提交新报价版本';event('取消模拟运行 '+run.key);render();toast('已取消；没有新版本。');}
function report(q){const r=latest(q);const ids=['合同条款','目标市场'].map(kind=>activeKnowledge(kind,r.scenario)).filter(Boolean).map(k=>k.id);const found=issues(r);const existing=q.reports.find(p=>p.revisionId===r.id&&JSON.stringify(p.sources)===JSON.stringify(ids)&&JSON.stringify(p.issues)===JSON.stringify(found));if(existing){toast('同版本与同规则结果已存在，返回原报告。');return;}q.reports.push({id:id('report'),revisionId:r.id,version:r.version,at:now(),sources:ids,evidence:clone(['合同条款','目标市场'].map(kind=>knowledgeEvidence(kind,r.scenario))),issues:clone(found)});event(`${q.number} V${r.version} 保存检查报告：${found.length}项问题`);toast(found.length?'已保存检查报告，风险与任务共用同一结果。':'演示检查无关键阻断，接下来生成产出并送审。');}
function assertCurrentOutput(q,a){if(!a||latest(q).id!==a.revisionId||currentArtifact(q)?.id!==a.id)throw Error('版本或产出已变化，请重新打开当前产出。');}
function rejectArtifact(q,a,reason){assertCurrentOutput(q,a);if(a.review!=='submitted'||approval(q,a))throw Error('只有待审核且未批准的产出可以驳回');if(!reason.trim())throw Error('请填写驳回原因');a.review='rejected';a.rejection=reason;q.approvals.push({id:id('approval'),artifactId:a.id,revisionId:a.revisionId,status:'rejected',reviewer:'演示主管',note:reason,at:now(),sent:false});event(q.number+' 产出被驳回：'+reason);}
function markArtifactSent(q,a){assertCurrentOutput(q,a);const ap=approval(q,a);if(!ap||ap.sent||outputIssues(q,a).length)throw Error('产出或依据已变化，不能记录发送');ap.sent=true;ap.sentAt=now();event(q.number+' 的指定产出已模拟记录发送');}
function approveDialog(){const q=current(),r=latest(q),a=currentArtifact(q,r);if(!a||a.review!=='submitted'||outputIssues(q,a).length)throw Error('需当前产出提交审核且关键问题全部解决。');showDialog('人工审批 · '+q.number+' / V'+r.version,`<div class="stack"><div class="note warning">此操作只模拟人工审批，绑定产出 ${esc(a.id.slice(-8))}。不会审批其他版本或未来重生成内容。</div>${field('演示审核人','reviewer','演示主管','text','required maxlength="80"')}${textfield('审核说明','note','已核对合成事实、金额、条款与产出。','required maxlength="500"')}<label class="checkline"><input type="checkbox" name="facts" required><span>已核对商品、数量、金额、币种、费用和条款。</span></label><label class="checkline"><input type="checkbox" name="language" required><span>已逐项核对目标语言正文及商业条件，无遗留待译项；本次仍仅为模拟审核。</span></label><label class="checkline"><input type="checkbox" name="synthetic" required><span>确认所有数据为合成演示，不作真实商业承诺。</span></label></div>`,'批准这个产出',form=>{if(latest(q).id!==r.id||currentArtifact(q,r).id!==a.id||a.review!=='submitted'||approval(q,a)||outputIssues(q,a).length)throw Error('版本、产出或依据已经变化，请重新核对。');const data=Object.fromEntries(new FormData(form));if(!data.facts||!data.language||!data.synthetic)throw Error('请完成全部核对。');q.approvals.push({id:id('approval'),artifactId:a.id,revisionId:r.id,status:'approved',reviewer:data.reviewer,note:data.note,at:now(),sent:false});event(`${q.number} V${r.version} 人工模拟批准产出 ${a.id.slice(-8)}`);closeDialog();render();toast('仅此产出获模拟批准，新版本与新产出不沿用。');});}
function validateBackup(x){if(!x||x.schema!==1||!Array.isArray(x.products)||!Array.isArray(x.quotes)||!Array.isArray(x.knowledge)||!Array.isArray(x.batches)||!Array.isArray(x.runs)||!Array.isArray(x.events)||!x.scenario||!x.settings)throw Error('不是本HTML的完整演示备份。');if(x.quotes.length>50||x.products.length>500||x.knowledge.length>500||x.runs.length>500)throw Error('备份超出演示容量');const walk=value=>{if(Array.isArray(value)){value.forEach(walk);return;}if(value&&typeof value==='object'){for(const [key,v]of Object.entries(value)){if(['__proto__','constructor','prototype'].includes(key))throw Error('备份含非法字段');if(['id','entry','revisionId','artifactId','quoteId','baseId','key','committed'].includes(key)&&v!==null&&typeof v==='string'&&!/^[a-zA-Z0-9-]+$/.test(v))throw Error('备份标识格式错误');walk(v);}}};walk(x);if(typeof x.workspace!=='string'||!['none','timeout','auth','invalid'].includes(x.settings.failure)||!['600','1800','8000'].includes(x.settings.delay)||!Number.isInteger(x.sequence)||x.sequence<0)throw Error('设置格式错误');for(const k of x.knowledge){if(!['candidate','approved','published','withdrawn','rejected'].includes(k.status)||!['合同条款','目标市场','术语','SOP'].includes(k.kind)||!Number.isInteger(k.version)||k.version<1)throw Error('知识格式错误');for(const key of ['title','body','source','original','scope','valid'])if(typeof k[key]!=='string')throw Error('知识字段缺失');}for(const q of x.quotes){if(!/^Q-DEMO-\d+$/.test(q.number)||!Array.isArray(q.revisions)||!q.revisions.length||q.revisions.length>100||!Array.isArray(q.artifacts)||!Array.isArray(q.approvals)||!Array.isArray(q.reports)||!Array.isArray(q.turns))throw Error('报价结构错误');q.revisions.forEach((r,index)=>{if(r.version!==index+1||!['USD','EUR','CNY'].includes(r.currency)||!['sales','cost'].includes(r.mode))throw Error('报价版本或计算配置错误');for(const key of ['payment','delivery','packaging','inquiry','buyer'])if(typeof r[key]!=='string')throw Error('报价字段缺失');validatePackaging(r);compute(r);});for(const a of q.artifacts)if(!q.revisions.some(r=>r.id===a.revisionId)||!['en','de','zh'].includes(a.language)||!['rfq','email'].includes(a.scene)||typeof a.text!=='string')throw Error('产出结构错误');}for(const run of x.runs){if(!['queued','running','failed','completed','cancelled','interrupted','waiting_input'].includes(run.status)||!['connection','understand','revise'].includes(run.kind))throw Error('运行结构错误');if(['queued','running'].includes(run.status)){run.status='interrupted';run.message='页面重开或备份恢复后标记中断，需显式重试。';}}return x;}
function resetDialog(empty=false){showDialog(empty?'清空演示工作区':'重置预置演示',`<div class="stack"><p>将替换此HTML在当前浏览器中保存的演示状态，包括报价、知识和审批记录。</p><div class="note">仅影响本演示，不会访问正式应用数据。${empty?'重置后从发布资料开始。':'重置后包含三类商品、三份知识和100件商品的V1。'}</div>${btn('先下载演示备份','backup','','small')}</div>`,'确认重置',()=>{for(const timer of timers.values())clearTimeout(timer);timers.clear();state=initial(empty);selected=null;viewVersion=null;tab='detail';page='overview';if(!empty)newQuote({seedPackaging:true,packaging:'标准纸箱（合成资料）',lines:[{product:clone(state.products[0]),quantity:'100'}]});event(empty?'清空演示工作区':'重置为预置合成样本');closeDialog();render();toast('已重置演示。');});}

 'cancel-run':el=>cancelRun(state.runs.find(r=>r.id===el.dataset.id)),

 'restore-version':()=>{const q=current(),r=viewed(q),head=latest(q);showDialog('从历史快照创建新版本',`<p>将 V${r.version} 的业务事实复制为新的 V${head.version+1}。旧版、旧产出、旧审批均保留，不把历史审批复制给新版本。</p>`,'确认恢复为新版本',()=>{if(latest(q).id!==head.id)throw Error('当前版本已变化，请重试。');restoreQuoteVersion(q,head.id,r.id);closeDialog();render();toast('已创建新版本，需重新检查与审核。');});},
 check:()=>{report(current());tab='checks';render();},
 reports:()=>{const q=current();showDialog('历史检查报告',`<div class="stack">${[...q.reports].reverse().map(r=>`<div class="source-card"><h3>V${r.version} · ${r.issues.length}项问题</h3><small>${esc(r.at)} · 规则版本 ${r.sources.map(esc).join(', ')}</small><div class="spacer"></div>${r.evidence?`<details><summary>当时冻结的原文与检查依据</summary>${evidenceView(r.evidence)}</details>`:''}${r.issues.map(i=>`<p>${esc(i.title)} ${badge(i.severity)}</p>`).join('')||'<p>当时合成检查无关键问题。</p>'}</div>`).join('')}</div>`);},
 'focus-issue':el=>{if(el.dataset.field==='knowledge'){go('knowledge');return;}tab='detail';page='quotes';render();const target=$('#field-'+el.dataset.field);if(target){target.classList.add('highlight');target.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>target.classList.remove('highlight'),2500);}},
 'resolve-task':el=>resolveTask(el.dataset.quote,el.dataset.field),
 'source-product':el=>sourceProduct(el.dataset.id),
 'source-knowledge':el=>knowledgeDetail(state.knowledge.find(k=>k.id===el.dataset.id)),
 'import-csv':importDialog,
 'fill-csv':()=>{$('#dialog [name=csv]').value=SAMPLE_CSV.replaceAll('DEMO-','NEW-');},
 batch:el=>batchDialog(state.batches.find(b=>b.id===el.dataset.id)),
 'correct-csv':el=>{const b=state.batches.find(b=>b.id===el.dataset.id);importDialog();$('#dialog [name=filename]').value=b.name;$('#dialog [name=csv]').value=b.raw;},
 'new-knowledge':()=>knowledgeDialog(),
 'revise-knowledge':el=>knowledgeDialog(state.knowledge.find(k=>k.id===el.dataset.id)),
 'compose-knowledge':()=>{const raw=$('#dialog [name=original]').value.trim();if(!raw)throw Error('请先提供原文。');$('#dialog [name=body]').value='依据本次合成原文整理：\n'+raw+'\n\n执行前核对适用范围与有效期；不补充原文未包含的商业事实。';toast('已生成候选文本；仍需人工修改和审核。');},
 'approve-knowledge':el=>{const k=state.knowledge.find(k=>k.id===el.dataset.id);showDialog('审核知识候选',`<div class="stack"><p>核对 ${esc(k.title)} V${k.version} 的正文、原文、范围和有效期。</p>${field('演示审核人','reviewer','演示资料管理员','text','required maxlength="80"')}<label class="checkline"><input type="checkbox" name="confirmed" required><span>我已对照原文确认，无依据内容不作为事实发布。</span></label></div>`,'审核通过，等待发布',form=>{if(k.status!=='candidate')throw Error('候选状态已变化');if(!k.original.trim()||!k.source.trim()||k.valid<frozenDate)throw Error('缺来源或已过期，不能批准');k.status='approved';k.reviewer=form.elements.reviewer.value;event('人工审核知识候选 '+k.title+' V'+k.version);closeDialog();render();knowledgeDetail(k);});},
 'reject-knowledge':el=>{const k=state.knowledge.find(k=>k.id===el.dataset.id);showDialog('驳回知识候选',textfield('驳回原因','reason','','required maxlength="500"'),'记录驳回',form=>{k.status='rejected';k.rejection=form.elements.reason.value;event('驳回知识候选 '+k.title);closeDialog();render();});},
 'publish-knowledge':el=>{const k=state.knowledge.find(k=>k.id===el.dataset.id);if(k.status!=='approved')throw Error('必须先审核通过');if(state.knowledge.some(x=>x.entry===k.entry&&x.version>k.version&&x.status==='published'))throw Error('已有更新的发布版本，请重新审核新候选');if(k.valid<frozenDate)throw Error('版本已过期');k.status='published';event('人工显式发布 '+k.title+' V'+k.version+'；旧版仍保留');closeDialog();render();toast('知识已发布，后续检索采用有效版本。');},
 'withdraw-knowledge':el=>{const k=state.knowledge.find(k=>k.id===el.dataset.id);showDialog('撤回知识并提醒复核',`<p>撤回“${esc(k.title)}”后，新检查不能继续采用这个版本。历史报价、报告与审核保留；当前依据不足会阻止新的正式导出。</p>`,'确认撤回',()=>{k.status='withdrawn';event('撤回知识 '+k.title+'；产生适用性复核提示');closeDialog();render();toast('已撤回。请在任务或审核页面检查受影响报价。');});},
 'lint-knowledge':()=>{const found=maintenanceIssues();event('知识维护检查：'+found.length+'项问题');toast(found.length?'发现'+found.length+'项维护问题，请查看。':'知识来源/时效的模拟检查通过；不代表语义完整性。');render();},
 maintenance:()=>{const found=maintenanceIssues();showDialog('知识维护问题',found.length?found.map(i=>`<div class="issue"><h3>${esc(i.title)}</h3><p>${esc(i.reason)}</p>${i.id?btn('查看版本','source-knowledge',`data-id="${i.id}"`,'small'):btn('新建适用知识','new-knowledge','','small')}</div>`).join(''):'<div class="note success">当前没有来源/时效/规则覆盖问题。语义矛盾仍需要人工复核。</div>');},
 'to-output':()=>go('outputs'),
 'generate-output':()=>{const q=current();const selectedLanguage=document.querySelector('[name=outputLanguage]').value,language=languageCode(selectedLanguage==='other'?document.querySelector('[name=customLanguage]').value:selectedLanguage),scene=document.querySelector('[name=outputScene]').value;q.outputSelection={language:selectedLanguage,customLanguage:language,scene};if(!['en','de','zh'].includes(language)){(q.languageRequests??=[]).push({language,at:now(),message:'暂无离线模板，需正式模型与人工语言复核'});event('目标语言 '+language+' 未支持，未生成产出');render();toast('已记录目标语言请求；暂无离线模板，未生成产出。',true);return;}makeArtifact(q,language,scene);render();toast('已新建未审核产出，固定事实未改变。');},
 'edit-output':()=>{const q=current(),r=latest(q),a=currentArtifact(q,r);showDialog('修改正文并生成新产出',`<div class="stack">${textfield('正文 · 需人工核对事实','body',a.text,'rows="14" required maxlength="20000"')}<div class="note warning">本样机只阻止显式“原文待译”标记，不会证明任意手改文本与报价事实一致；请逐项翻译并核对商品、数值及条件，主管仍须人工复核。保存生成新产出，旧审批不沿用。</div></div>`,'另存为未审核产出',form=>{assertCurrentOutput(q,a);if(form.elements.body.value===a.text)throw Error('正文没有变化');makeArtifact(q,a.language,a.scene,form.elements.body.value);closeDialog();render();});},
 'copy-output':async()=>{const a=currentArtifact();try{await navigator.clipboard.writeText(a.text);toast('正文已复制；请保留合成演示标识。');}catch{showDialog('复制正文',textfield('选中后使用系统复制','copy',a.text,'rows="15" readonly'));$('#dialog textarea').select();}},
 'download-draft':()=>{const q=current(),a=currentArtifact();download(q.number+'-'+a.language+'-DEMO-DRAFT.txt','未审核草稿 / SYNTHETIC DEMO\n'+a.text);},
 'download-approved':()=>{const q=current(),a=currentArtifact();if(!approval(q,a)||outputIssues(q,a).length)throw Error('审批或资料有效性条件不满足');download(q.number+'-'+a.language+'-DEMO-APPROVED.html',outputHtml(q,a,true),'text/html;charset=utf-8');},
 'print-output':()=>{const q=current(),a=currentArtifact(),approved=!!approval(q,a)&&!outputIssues(q,a).length;const w=window.open('','_blank');if(!w)throw Error('浏览器拦截了打印窗口，请允许本页打开窗口。');w.opener=null;w.document.open();w.document.write(outputHtml(q,a,approved));w.document.close();setTimeout(()=>{w.focus();w.print();},150);toast('已打开打印预览，可选择“另存为PDF”；未发送任何内容。');},
 'submit-review':()=>{const q=current(),r=latest(q),a=currentArtifact(q,r);if(!a||outputIssues(q,a).length)throw Error('关键问题未解决，不可送审');if(approval(q,a))throw Error('此产出已审核，无需重复提交');a.review='submitted';report(q);event(q.number+' V'+r.version+' 产出提交人工审核');render();toast('已送审，请由演示主管核对并明确批准。');},
 'approve-output':approveDialog,
 'reject-output':()=>{const q=current(),a=currentArtifact();showDialog('驳回此产出',textfield('驳回原因','reason','','required maxlength="500"'),'记录驳回',form=>{rejectArtifact(q,a,form.elements.reason.value);closeDialog();render();});},
 'mark-sent':()=>{const q=current(),a=currentArtifact(),ap=approval(q,a);if(!ap||outputIssues(q,a).length)throw Error('当前内容尚不满足发送记录条件');showDialog('模拟记录发送事实','<p>这只追加一条演示记录，不调用邮箱、不上传平台、不向任何人发送内容。下载和打印本身不会触发这个状态。</p>','确认模拟标记',()=>{markArtifactSent(q,a);closeDialog();render();});},
 'output-history':()=>{const q=current();showDialog('产出与审核历史',`<div class="stack">${[...q.artifacts].reverse().map(a=>{const r=q.revisions.find(v=>v.id===a.revisionId),ap=approval(q,a);return `<div class="source-card"><h3>V${r.version} · ${a.language.toUpperCase()} / ${a.scene}</h3><small>${esc(a.created)} · ${esc(a.id.slice(-8))}</small>${badge(ap?'曾获模拟批准':'未获批准',ap?'green':'amber')}${ap?`<p class="page-help">${esc(ap.reviewer)} · ${esc(ap.at)} ${ap.sent?'· 曾模拟记录发送':''}</p>`:''}<details><summary>查看冻结正文</summary><pre class="code">${esc(a.text)}</pre></details></div>`;}).join('')}</div>`);},
 'test-model':()=>{startRun({kind:'connection',input:'离线模型连接测试'});go('runs');},
 backup:()=>download('tradequote-SYNTHETIC-demo-backup.json',JSON.stringify(state,null,2),'application/json;charset=utf-8'),
 'restore-backup':()=>showDialog('恢复演示备份',`<div class="stack"><label>选择此HTML导出的JSON<input id="backup-file" type="file" accept=".json,application/json"></label><div id="backup-preview" class="note">选择文件后校验并展示内容摘要，不自动覆盖。</div></div>`),
 reset:()=>resetDialog(false),
 'empty-reset':()=>resetDialog(true)
};
document.addEventListener('click',async e=>{const button=e.target.closest('[data-action]');if(!button||button.disabled)return;try{const handler=actions[button.dataset.action];if(!handler)throw Error('交互未注册：'+button.dataset.action);await handler(button);}catch(error){if($('#dialog').open)errorInDialog(error);else toast(error.message,true);}});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;try{if(form.id==='dialog-form'){if(dialogHandler)await dialogHandler(form);return;}const data=Object.fromEntries(new FormData(form));if(form.id==='settings-form'){state.workspace=data.workspace;state.scenario={platform:data.platform,market:data.market,category:data.category,languages:data.languages};event('更新工作区与新报价默认场景，旧快照不变');render();toast('场景已保存，仅影响之后创建的报价。');}else if(form.id==='model-form'){state.settings={model:data.model,failure:data.failure,delay:data.delay};event('更新离线模型模拟配置');render();toast('模拟设置已保存。');}}catch(error){if($('#dialog').open)errorInDialog(error);else toast(error.message,true);}});
document.addEventListener('input',e=>{if(e.target.id==='knowledge-search')$('#knowledge-results').innerHTML=knowledgeList(e.target.value,$('#knowledge-filter').value);});
document.addEventListener('change',async e=>{const target=e.target;try{if(target.id==='quote-select'||target.name==='outputQuote'){selected=target.value;viewVersion=null;render();}else if(target.id==='version-select'){viewVersion=target.value;render();}else if(target.id==='knowledge-filter')$('#knowledge-results').innerHTML=knowledgeList($('#knowledge-search').value,target.value);else if(target.name==='currency'&&$('#dialog').open){$('#dialog [name=fx]').value={USD:'1',EUR:'0.92',CNY:'7.2'}[target.value];}else if(target.id==='csv-file'){const file=target.files[0];if(!file)return;if(file.size>262144||!file.name.toLowerCase().endsWith('.csv'))throw Error('请选择不超过256KiB的UTF-8 CSV');const text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());$('#dialog [name=csv]').value=text;$('#dialog [name=filename]').value=file.name;}else if(target.id==='backup-file'){const file=target.files[0];if(!file)return;if(file.size>2000000)throw Error('演示备份不能超过2MB');const candidate=validateBackup(JSON.parse(await file.text()));showDialog('确认恢复合成演示数据',`<div class="stack"><div class="note">${candidate.products.length}个商品 · ${candidate.quotes.length}张报价 · ${candidate.knowledge.length}个知识版本<br>恢复后会替换当前HTML的本地模拟数据；未完成运行将标记中断。</div><label class="checkline"><input name="confirmed" type="checkbox" required><span>确认替换当前演示状态</span></label></div>`,'恢复这份备份',()=>{for(const timer of timers.values())clearTimeout(timer);timers.clear();state=candidate;selected=null;viewVersion=null;page='overview';tab='detail';event('从合成JSON备份恢复演示');closeDialog();render();toast('演示数据已恢复；正式应用数据未被访问。');});}}catch(error){if($('#dialog').open)errorInDialog(error);else toast(error.message,true);}});
render();
</script>
</body>
</html>
